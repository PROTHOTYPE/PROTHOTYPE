<svg width="960" height="230" viewBox="0 0 960 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="studioGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255,255,255,0.045)" stroke-width="1"/>
    </pattern>
    <radialGradient id="emberGlow" cx="18%" cy="22%" r="62%">
      <stop offset="0%" stop-color="#FF5E1A" stop-opacity="0.22"/>
      <stop offset="48%" stop-color="#F59E0B" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#08080A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="typeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5E1A"/>
      <stop offset="58%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#F5F5F7"/>
    </linearGradient>
    <linearGradient id="hairlineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5E1A" stop-opacity="0.7"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect x="0.5" y="0.5" width="959" height="229" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Obsidian Canvas + Architectural Grid + Ember Spotlight -->
    <rect width="960" height="230" fill="#08080A"/>
    <rect width="960" height="230" fill="url(#studioGrid)"/>
    <rect width="960" height="230" fill="url(#emberGlow)"/>

    <!-- Top Metadata Bar -->
    <text x="44" y="42" fill="#A1A1AA" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="1.6">
      DOSSIÊ TÉCNICO · FULL STACK &amp; SISTEMAS
    </text>

    <!-- Status Pill (Top Right) -->
    <rect x="698" y="24" width="218" height="26" rx="13" fill="#14141A" stroke="rgba(255,255,255,0.09)"/>
    <circle cx="715" cy="37" r="4" fill="#34D399"/>
    <text x="727" y="41" fill="#E4E4E7" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.8" letter-spacing="0.8">
      ONLINE · ABERTO A VAGAS
    </text>

    <!-- Hairline Separator -->
    <line x1="44" y1="62" x2="916" y2="62" stroke="url(#hairlineGrad)" stroke-width="1"/>

    <!-- PT Monogram Badge (matching portfolio icon.svg) -->
    <rect x="44" y="84" width="66" height="66" rx="14" fill="#111115" stroke="rgba(255,255,255,0.14)" stroke-width="1.2"/>
    <text x="77" y="127" text-anchor="middle" fill="#F5F5F7" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="27" letter-spacing="-1">
      PT
    </text>
    <circle cx="96" cy="98" r="4.5" fill="#FF5E1A"/>

    <!-- Wordmark PROTHOTYPE -->
    <text x="130" y="123" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="40" letter-spacing="-1.4">
      <tspan fill="#F5F5F7">PROTHO</tspan><tspan fill="url(#typeGrad)">TYPE</tspan>
    </text>
    <text x="132" y="148" fill="#A1A1AA" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17" letter-spacing="0.2">
      — laboratório de builds, sistemas nativos &amp; software feito para produção.
    </text>

    <!-- Bottom Studio Footer Bar -->
    <line x1="44" y1="176" x2="916" y2="176" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="44" y="203" fill="#A1A1AA" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="0.6">
      PEDRO TEIXEIRA · TYPESCRIPT · REACT · RUST (TAURI/AXUM) · POSTGRESQL · CLOUDFLARE
    </text>
    <text x="916" y="203" text-anchor="end" fill="#6B6B76" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="0.8">
      -5.7945° S, 35.2110° W · NATAL / RN
    </text>
  </g>

  <!-- Outer Hairline Border -->
  <rect x="0.5" y="0.5" width="959" height="229" rx="16" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
</svg>
